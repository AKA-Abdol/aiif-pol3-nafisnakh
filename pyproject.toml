[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nafisnakh"
version = "0.1.0"
description = "AI B2B CRM copilot for Nafis Nakh — evidence-backed signal engine and action queue"
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nafisnakh = "nafisnakh.cli:app"

[tool.setuptools.packages.find]
include = ["nafisnakh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
